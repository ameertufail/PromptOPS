name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 20

      - name: Install dependencies
        run: pnpm install:ci

      # IMPORTANT: This step re-runs ALL migration files on every deploy.
      # All SQL migrations MUST be idempotent (use IF NOT EXISTS, IF EXISTS,
      # CREATE TABLE IF NOT EXISTS, etc.) so that re-applying an already-applied
      # migration is a safe no-op. Failing to do so will cause deploy failures
      # or data corruption.
      - name: Apply D1 migrations to production
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for migration in src/db/migrations/*.sql; do
            echo "Applying $migration..."
            npx wrangler d1 execute promptops-db --file="$migration" --remote --env production
          done

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:api

      - name: Verify production health
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://promptops-api-production.promptops-ameer.workers.dev/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed (200 OK)"
